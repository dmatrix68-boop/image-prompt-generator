name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0)"
        required: true
      title:
        description: "Release title (defaults to the tag)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release package
        run: |
          mkdir -p dist
          zip -r "dist/image-prompt-generator-${{ inputs.tag }}.zip" \
            index.html css js docs start.bat serve.py README.md README.de.md LICENSE
      - name: Create release or upload package to existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.tag }}" dist/*.zip \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ inputs.tag }}" dist/*.zip \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "${{ inputs.title != '' && inputs.title || inputs.tag }}" \
              --notes-file .github/RELEASE_NOTES.md
          fi
